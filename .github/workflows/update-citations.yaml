name: update-citations
run-name: update citations

on:
  # run when called from another workflow
  workflow_call:
    inputs:
      open-pr:
        type: boolean
        default: false
    outputs:
      changed:
        value: ${{ jobs.update-citations.outputs.changed }}

  # run if user manually requests it
  workflow_dispatch:

env:
  FORCE_COLOR: true

jobs:
  get-input:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Debug dump
        if: runner.debug == '1'
        uses: crazy-max/ghaction-dump-context@v3

      - name: Checkout pr branch contents
        if: github.event.number != ''
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}

      - name: Upload sources artifact
        if: github.event.number != ''
        uses: actions/upload-artifact@v7
        with:
          name: update-citations-${{ github.event.number }}
          path: |
            _data/**/*.yaml
            _data/**/*.yml
          retention-days: 1

  update-citations:
    needs: get-input
    permissions:
      actions: read
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_SCHOLAR_API_KEY: ${{ secrets.GOOGLE_SCHOLAR_API_KEY }}

    steps:
      - name: Debug dump
        if: runner.debug == '1'
        uses: crazy-max/ghaction-dump-context@v3

      - name: Checkout base branch contents
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - name: Download sources artifact
        if: github.event.number != ''
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: update-citations-${{ github.event.number }}
          path: artifacts

      - name: Import input data
        if: github.event.number != ''
        run: |
          rm -rf _data
          mkdir -p _data
          cp -R artifacts/_data/. _data/

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade --requirement ./_cite/requirements.txt

      - name: SSH debug
        if: runner.debug == '1'
        uses: mxschmitt/action-tmate@v3

      - name: Build updated citations
        run: python _cite/cite.py
        timeout-minutes: 15

      - name: Check if citations changed
        id: changed
        uses: tj-actions/verify-changed-files@v20
        with:
          files: |
            _data/citations.yaml

      - name: Stash updated citations
        if: |
          github.event.number != '' &&
          steps.changed.outputs.files_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: cp _data/citations.yaml "$RUNNER_TEMP/citations.yaml"

      - name: Checkout pr branch contents
        if: |
          github.event.number != '' &&
          steps.changed.outputs.files_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.head_ref }}

      - name: Restore updated citations
        if: |
          github.event.number != '' &&
          steps.changed.outputs.files_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p _data
          cp "$RUNNER_TEMP/citations.yaml" _data/citations.yaml

      - name: Commit citations to same-repository branch
        if: |
          github.event.number != '' &&
          steps.changed.outputs.files_changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          file_pattern: _data/citations.yaml
          commit_message: "Update citations"

      - name: Commit citations to current branch
        if: |
          github.event.number == '' &&
          steps.changed.outputs.files_changed == 'true' &&
          inputs.open-pr != true
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update citations"

      - name: Open pull request with updated citations
        if: |
          github.event.number == '' &&
          steps.changed.outputs.files_changed == 'true' &&
          inputs.open-pr == true
        uses: peter-evans/create-pull-request@v6
        with:
          branch: citation-update
          title: Periodic citation update
          body: |
            To see a live preview of this PR, close (don't merge) and reopen it.

    outputs:
      changed: ${{ steps.changed.outputs.files_changed }}
