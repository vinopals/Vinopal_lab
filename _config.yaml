# site properties and page defaults
title: Vinopal Lab
title: Vinopal Lab
subtitle: >-
  Cell Biology and Tardigrade Research Group
  <br>at the <a href="https://cenab.ujep.cz">Centre for Nanomaterials and Biotechnology</a>, <a href="https://prf.ujep.cz/en/">Faculty of Science</a>, Jan Evangelista Purkyně University in Ústí nad Labem
description: We study cell biology with a special focus on tardigrades and cytoskeletal dynamics.

header: /images/background.jpg
footer: /images/background.jpg

baseurl: "/Vinopal_lab"

# Contact and links
links:
  email: vinopals@g.ujep.cz
  orcid: 0000-0001-9352-4580
  github: vinopals
  
proofer: false

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
