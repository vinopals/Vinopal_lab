{%- if include.icon == "manubot.svg" -%}
  <span class="icon">
    {%- include manubot.svg -%}
  </span>
{%- elsif include.icon contains ".svg" -%}
  <span class="icon">
    <img src="{{ include.icon | relative_url }}" alt="" aria-hidden="true">
  </span>
{%- elsif include.icon and include.icon != "" -%}
  <i class="icon {{ include.icon }}"></i>
{%- endif -%}
